name: Release FogFlow version
on: 
  push:
    branches: "fogflow-release/**"
jobs:
  build-fogflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22


      - name: Get release number
        id: get-id
        run: |
          id=$(echo ${{github.ref_name}} | cut -d/ -f2)
          echo "::set-output name=id::$id"

      - name: Build FogFlow
        run: |
          ./build.sh development

      - name: docker tag #for making latest
        run: |
          docker tag fogflow/master:latest fogflow/master:${{steps.get-id.outputs.id}}
          docker tag fogflow/broker:latest fogflow/master:${{steps.get-id.outputs.id}}
          docker tag fogflow/discovery:latest fogflow/master:${{steps.get-id.outputs.id}}
          docker tag fogflow/designer:latest fogflow/master:${{steps.get-id.outputs.id}}
          docker tag fogflow/worker:latest fogflow/master:${{steps.get-id.outputs.id}}
          
      - name: docker-login #docker login setup a secret with a token
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: docker push
        run: |
          docker push fogflow/master:${{steps.get-id.outputs.id}}
          docker push fogflow/master:latest
          docker push fogflow/broker:${{steps.get-id.outputs.id}}
          docker push fogflow/broker:latest
          docker push fogflow/discovery:${{steps.get-id.outputs.id}}
          docker push fogflow/discovery:latest
          docker push fogflow/designer:${{steps.get-id.outputs.id}}
          docker push fogflow/designer:latest
          docker push fogflow/worker:${{steps.get-id.outputs.id}}
          docker push fogflow/worker:latest

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get-id.outputs.id }}
          release_name: v${{ steps.get-id.outputs.id }}
          draft: false
          prerelease: false

